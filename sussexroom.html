        <br><br>
        
        <label for="message">Please Input Staff Name:</label><br>
        <textarea id="message" name="message" rows="4" cols="40"></textarea>
        
        <br><br>

		<form action="/upload-destination" method="POST" enctype="multipart/form-data">
 			<label for="image-picker">Choose images to upload:</label>
  			<input type="file" id="image-picker" name="image" accept="image/*">
  			<button type="submit">Upload</button>
		</form>
		
		<br><br>
		
        <button type="button" onclick="sendEmail()">Send Email</button>
    </form>

    <script>
        function sendEmail() {
            const recipient = "roomphotos@mightyoak.com.au";
            const messageBody = document.getElementById('message').value;
            const subject = document.getElementById('topic').value;
            const body = encodeURIComponent(messageBody);
            
            // Opens the user's default mail client (Outlook, Apple Mail, Gmail, etc.)
            window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
        }
    </script>
