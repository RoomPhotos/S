        <label for="message">Please Input Staff Name:</label><br>
        <textarea id="message" name="message" rows="4" cols="40"></textarea>
        
        <br><br>
		
        <button type="button" onclick="sendEmail()">Send Email</button>
    </form>

    <script>
        function sendEmail() {
            const recipient = "roomphotos@mightyoak.com.au";
            const messageBody = document.getElementById('message').value;
            const subject = document.getElementById('participant').value;
            const encodedSubject = encodeURIComponent(subject);
            const body = encodeURIComponent(messageBody);
            
            // Opens the user's default mail client (Outlook, Apple Mail, Gmail, etc.)
            window.location.href = `mailto:${recipient}?subject=${encodedSubject}&body=${body}`;
        }
    </script>

</body>
